# ⚠️  NOT ENCRYPTED — run sops to encrypt this:
#    $ sops -e -i secrets/common.yaml
#    (Or: sops secrets/common.yaml  to edit interactively)
#
# ⚠️  Generate age key first:
#    $ mkdir -p ~/.config/sops/age
#    $ age-keygen -o ~/.config/sops/age/keys.txt
#    Then put the public key (age1...) into secrets/.sops.yaml.

ssh:
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    YOUR_ACTUAL_SSH_PRIVATE_KEY_HERE
    -----END OPENSSH PRIVATE KEY-----
